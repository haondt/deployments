components:
  primary:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    talos: +!
    resources.limits.memory: 4Gi
    networking:
      ports:
        http: 8080
      gateway.http_routes:
        - port: http
          host: "open-webui.{{ haondt__default_host }}"
    volumes:
      config:
        src.host:
          dir: /mnt/pepper/gabbro_cluster/open-webui/data
          read_only: false
          create: true
        dest.dir: /app/backend/data
    environment:
      - raw:
          OPENAI_API_BASE_URLs: https://opencode.ai/zen/go/v1
      - secret: true
        raw:
          WEBUI_SECRET_KEY: "{{ open_webui__secret_key }}"
          OPENAI_API_KEYS: "{{ opencode__api_key }}"
