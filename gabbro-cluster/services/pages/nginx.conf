server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /state/ {
        dav_methods PUT;
        create_full_put_path on;
        client_max_body_size 64k;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

