components:
  primary:
    image: docker.io/library/nginx:mainline@sha256:600f7cd45e27aa13e9304c834ab7c1b0ff39df85ee1dcc5087955455d77bc83b
    talos: +!
    networking:
      ports:
        http: 8080
        ingest: 8081
      gateway.http_routes:
        - port: http
          host: "pages.{{ haondt__default_host }}"
        - port: ingest
          host: "pages-ingest.{{ haondt__default_host }}"
    volumes:
      nginx-html:
        src.host:
          dir: /mnt/carrot/gabbro/pages/nginx-html
          read_only: false
          create: true
        dest.dir: /usr/share/nginx
      nginx-conf:
        src.file: nginx.conf
        dest.file: /etc/nginx/conf.d/nginx.conf
    startup:
      tasks:
        - busybox:
            script: |-
              set -euo pipefail
              mkdir -p /usr/share/nginx/html/state
              chmod 777 /usr/share/nginx/html/state
    sidecars:
      ingest:
        image: rclone/rclone:latest
        talos: +!
        args:
          - "serve"
          - "s3"
          - "/data"
          - "--addr"
          - "0.0.0.0:8081"
          - "--auth-key"
          - "pages,pages"
        volumes:
          nginx-html:
            src.volume.name: nginx-html
            dest.dir: /data
