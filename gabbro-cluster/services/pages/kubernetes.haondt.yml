components:
  primary:
    image: docker.io/library/nginx:mainline@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
    talos: +!
    networking:
      ports:
        http: 8080
        ingest: 8081
      gateway.http_routes:
        - port: http
          host: "pages.{{ haondt__default_host }}"
        - port: ingest
          host: "pages-ingest.{{ haondt__default_host }}"
    volumes:
      nginx-html:
        src.host:
          dir: /mnt/carrot/gabbro/pages/nginx-html
          read_only: false
          create: true
        dest.dir: /usr/share/nginx
      nginx-conf:
        src.file: nginx.conf
        dest.file: /etc/nginx/conf.d/nginx.conf
    sidecars:
      ingest:
        image: rclone/rclone:latest
        talos: +!
        args:
          - "serve"
          - "s3"
          - "/data"
          - "--addr"
          - "0.0.0.0:8081"
          - "--auth-key"
          - "pages,pages"
        volumes:
          nginx-html:
            src.volume.name: nginx-html
            dest.dir: /data
