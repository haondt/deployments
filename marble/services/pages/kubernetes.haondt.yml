components:
  primary:
    image: docker.io/library/nginx:mainline@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4
    talos: +!
    networking:
      ports:
        http: 8080
        ingest: 8081
      gateway.http_routes:
        - port: http
          host: "pages.{{ haondt__default_host }}"
        - port: ingest
          host: "pages-ingest.{{ haondt__default_host }}"
    volumes:
      nginx-html:
        src.scratch.size: 1Mi
        dest.dir: /usr/share/nginx
      nginx-conf:
        src.file: nginx.conf
        dest.file: /etc/nginx/conf.d/nginx.conf
