components:
  primary:
    image: docker.io/library/nginx:mainline@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4
    talos: +!
    networking:
      ports:
        http: 8080
      gateway.http_routes:
        - port: http
          host: "pages.{{ haondt__default_host }}"
    volumes:
      git:
        src.scratch.size: 1Gi
        dest.dir: /git
      nginx-html:
        src.scratch.size: 1Mi
        dest.dir: /usr/share/nginx
      nginx-conf:
        src.file: nginx.conf
        dest.file: /etc/nginx/conf.d/nginx.conf
    sidecars:
      git-sync:
        image: registry.gitlab.com/haondt/cicd/registry/git-sync:4.7.1
        talos: +!
        environment:
          - raw:
              GITSYNC_USERNAME: gitlab+deploy-token-15481128
              GITSYNC_REPO: https://gitlab.com/haondt/pages.git
              GITSYNC_REF: main
              GITSYNC_ROOT: /git
              GITSYNC_LINK: /usr/share/nginx/html
              GITSYNC_PERIOD: 1h
          - raw:
              GITSYNC_PASSWORD: "{{ gitlab__deploy_token }}"
            secret: true
        volumes:
          git:
            src.volume.name: git
            dest.dir: /git
          nginx-html:
            src.volume.name: nginx-html
            dest.dir: /usr/share/nginx
