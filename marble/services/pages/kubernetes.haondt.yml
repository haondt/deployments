components:
  primary:
    image: nginx:mainline
    #talos: +!
    networking:
      ports:
        http: 8080
      gateway.http_routes:
        - port: http
          host: "pages.{{ haondt__default_host }}"
    volumes:
      git:
        src.scratch.size: 1Gi
        dest.dir: /git
      nginx-html:
        src.scratch.size: 1Mi
        dest.dir: /usr/share/nginx
      nginx-conf:
        src.file: nginx.conf
        dest.file: /etc/nginx/conf.d/nginx.conf
    sidecars:
      git-sync:
        image: registry.gitlab.com/haondt/cicd/registry/git-sync:4.7.1
        #talos: +!
        args:
          - --repo=https://github.com/kubernetes/git-sync
          - --ref=master
          - --root=/git
          - --link=/usr/share/nginx/html
          - --period=120s
        volumes:
          git:
            src.volume.name: git
            dest.dir: /git
          nginx-html:
            src.volume.name: nginx-html
            dest.dir: /usr/share/nginx
