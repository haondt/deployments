components:
  primary:
    image: ghcr.io/hargata/lubelogger:latest@sha256:8d662c13237dd83fac33def4071076fe906108589f85b1368f652c16f5f2dda7
    talos: +!
    networking:
      ports:
        http: 8080
      gateway.http_routes:
        - port: http
          host: "lubelogger.{{ haondt__default_host }}"
    volumes:
      data:
        src.pvc.size: 128Mi
        dest.dir: /App/data
      keys:
        src.pvc.size: 128Mi
        dest.dir: /root/.aspnet/DataProtection-Keys
    charon:
      overlays: [weekly]
      backups:
        - overlays: [default-hzsb]
          repository_configs:
            - raw: |-
                backend:
                  path: deployments-lubelogger
                unlock: true
          source.volumes:
            data: [/]
            keys: [/]
