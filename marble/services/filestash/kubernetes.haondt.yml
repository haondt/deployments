components:
  primary:
    image: docker.io/machines/filestash:latest@sha256:0b8fc005e52e6202c626ff5e155d8c2a313c83fd2130861b19fc96cdc41b55ad
    talos: +!
    networking:
      ports:
        http: 8334
      gateway.http_routes:
        - port: http
          host: "filestash.{{ haondt__default_host }}"
      dependencies:
        - name: wopi
          port: http
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /app/data/state
    environment:
      - raw:
          APPLICATION_URL: "https://filestash.{{ haondt__default_host }}"
          CANARY: true
          OFFICE_URL: "http://filestash-wopi:9980"
          OFFICE_FILESTASH_URL: "http://filestash-primary:8334"
          OFFICE_REWRITE_URL: "https://filestash-wopi.{{ haondt__default_host }}"

  wopi:
    image: collabora/code:24.04.10.2.1
    networking:
      ports:
        http: 9980
      gateway.http_routes:
        - port: http
          host: "filestash-wopi.{{ haondt__default_host }}"
      dependencies:
        - name: primary
          port: http
    command:
      - /bin/bash
      - -c
      - |
        curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
         /bin/su -s /bin/bash -c '/start-collabora-online.sh' cool
    security:
      user: 0
    environment:
      - raw:
          extra_params: "--o:ssl.enable=false"
          aliasgroup1: "https://.*:443"
