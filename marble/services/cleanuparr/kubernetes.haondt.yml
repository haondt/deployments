components:
  primary:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:6564af85578254728a9b06ded12836d2773e56f0da703c317cb589b176c4e215
    talos: +!
    resources:
      limits.memory: 512Mi
    networking:
      ports:
        http: 11011
      gateway.http_routes:
        - port: http
          host: "cleanuparr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
    environment:
      - raw: 
          PORT: 11011
          PUID: 1000
          PGID: 1000
