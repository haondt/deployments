components:
  primary:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:cfada3e5721451403a878ef67afb317692bb3afe277328b28ce4470bfba915d0
    talos: +!
    resources:
      limits.memory: 512Mi
    networking:
      ports:
        http: 11011
      gateway.http_routes:
        - port: http
          host: "cleanuparr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
    environment:
      - raw: 
          PORT: 11011
          PUID: 1000
          PGID: 1000
