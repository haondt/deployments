components:
  primary:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:c51af6957780ad2719e97a2131fe668f61da28e43363719c7b557577fc39ebaf
    talos: +!
    resources:
      limits.memory: 512Mi
    networking:
      ports:
        http: 11011
      gateway.http_routes:
        - port: http
          host: "cleanuparr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
    environment:
      - raw: 
          PORT: 11011
          PUID: 1000
          PGID: 1000
