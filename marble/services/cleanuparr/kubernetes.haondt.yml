components:
  primary:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:ec444338a67e429a20f6eef938e1ed771ce357ed4831765026096061a09bbbb7
    talos: +!
    resources:
      limits.memory: 512Mi
    networking:
      ports:
        http: 11011
      gateway.http_routes:
        - port: http
          host: "cleanuparr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
    environment:
      - raw: 
          PORT: 11011
          PUID: 1000
          PGID: 1000
