components:
  primary:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:98463b1116142887767cf90dde3375e7e43718aa623fe737677372023ffb7ebe
    talos: +!
    resources:
      limits.memory: 512Mi
    networking:
      ports:
        http: 11011
      gateway.http_routes:
        - port: http
          host: "cleanuparr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
    environment:
      - raw: 
          PORT: 11011
          PUID: 1000
          PGID: 1000
