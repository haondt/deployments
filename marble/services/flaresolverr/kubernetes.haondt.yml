components:
  primary:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    talos: +!
    resources:
      limits.memory: 4Gi
    networking:
      ports:
        http: 8191
      gateway.http_routes:
        - port: http
          host: "flaresolverr.{{ haondt__default_host }}"
    volumes:
      config:
        src.pvc.size: 128Mi
        dest.dir: /config
