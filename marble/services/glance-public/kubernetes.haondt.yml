components:
  primary:
    image: docker.io/glanceapp/glance:v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    talos: +!
    networking:
      ports:
        http: 8080
      rathole_routes:
        - port: http
          host: "glance.{{ haondt__default_public_host }}"
    volumes:
      config:
        src.dir: config
        dest.dir: /app/config
