components:
  primary:
    image: docker.io/glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    talos: +!
    networking:
      ports:
        http: 8080
      rathole_routes:
        - port: http
          host: "glance.{{ haondt__default_public_host }}"
    volumes:
      config:
        src.dir: config
        dest.dir: /app/config
